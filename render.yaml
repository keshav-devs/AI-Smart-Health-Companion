databases:
  - name: healthapp-db
    databaseName: healthapp
    user: healthapp
    plan: free
    region: oregon

services:
  - type: web
    name: healthapp-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.16"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: healthapp-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: BACKEND_CORS_ORIGINS
        value: https://healthapp-frontend-cftm.onrender.com
      - key: UPLOAD_DIR
        value: uploads

  - type: web
    name: healthapp-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://healthapp-backend-delo.onrender.com/api/v1
